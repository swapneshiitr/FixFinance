  - rating: { dimension: emergency_fund, equals: good }
  - report_cites_source: true
---
name: report_quality_judge
kind: report
proforma:
  monthly_take_home: 90000
  fixed_household_monthly: 55000
  epf_monthly: 5000
  emergency_fund: 80000
  term_life_cover: 0
  health_insurance_cover: 400000
  dependents: 2
  age: 38
  tax_regime: old
expect:
  - llm_judge:
      rubric: >
        The report must (1) reference the user's ACTUAL figures (rupee amounts or
        months/percentages), and (2) tie each recommendation to a named principle.
        Score 1.0 only if both hold across most recommendations.
      threshold: 0.6
