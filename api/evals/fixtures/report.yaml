# Report fixtures — wrap the proforma, run findings → RAG → synthesis, assert on content.
name: no_emergency_fund_report
kind: report
proforma:
  monthly_take_home: 80000
  fixed_household_monthly: 50000
  epf_monthly: 4000
  emergency_fund: 0
  term_life_cover: 0
  health_insurance_cover: 300000
  dependents: 1
  age: 32
  tax_regime: old
expect:
  - report_mentions: "emergency fund"
  - report_cites_source: true
  - rating: { dimension: emergency_fund, equals: act }
---
name: healthy_saver_report
kind: report
proforma:
  monthly_take_home: 200000
  fixed_household_monthly: 60000
  epf_monthly: 15000
  emergency_fund: 600000
  term_life_cover: 30000000
  health_insurance_cover: 1000000
  dependents: 1
  age: 35
  tax_regime: old
  sips:
    - { monthly_amount: 25000, category: equity }
    - { monthly_amount: 10000, category: elss }
