[project]
name = "fixfinance-api"
version = "0.1.0"
description = "FixFinance — AI personal-finance consultant (backend)"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Config / validation
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # DB (async app access + sync for LangGraph checkpointer)
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary,pool]>=3.2",
    # LLM + agent + RAG (used from Day-1 step 3 onward)
    # Provider-agnostic: the OpenAI SDK talks to any OpenAI-compatible endpoint
    # (Gemini default, Ollama, Groq, OpenAI). No vendor-specific SDK needed.
    "openai>=1.50",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    # Auth + misc
    "bcrypt>=4.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
